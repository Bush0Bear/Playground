[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "farkle-sim"
version = "1.0.0"
description = "Farkle dice simulator with an expected-value optimal-play advisor and the hot-dice household rule"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
farkle = "farkle.cli:main"

[tool.setuptools]
packages = ["farkle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
